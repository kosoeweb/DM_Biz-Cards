<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card Scanner</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
        <h2 class="text-2xl font-bold mb-4 text-center text-blue-600">Card Scanner</h2>

        <!-- Camera Input -->
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Scan Business Card</label>
            <input type="file" accept="image/*" capture="environment" id="cameraInput" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
        </div>

        <div id="loading" class="hidden text-center text-blue-500 mb-4 font-semibold">
            Scanning and extracting data... Please wait.
        </div>

        <!-- Form for Scanned Data -->
        <form id="cardForm" class="hidden">
            <div class="mb-2">
                <label class="block text-gray-700 text-sm font-bold mb-1">Name</label>
                <input type="text" id="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <div class="mb-2">
                <label class="block text-gray-700 text-sm font-bold mb-1">Company</label>
                <input type="text" id="company" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <div class="mb-2">
                <label class="block text-gray-700 text-sm font-bold mb-1">Phone</label>
                <input type="text" id="phone" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-1">Email</label>
                <input type="email" id="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <input type="hidden" id="raw_text">
            
            <button type="button" onclick="saveToSupabase()" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mb-4">
                Save to Database
            </button>
        </form>

        <hr class="my-4 border-gray-300">

        <button type="button" onclick="exportToExcel()" class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
            Export All to Excel
        </button>
    </div>

    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'https://zdifzvpjmmmsfitjsraw.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_Eghy_AeArZhWU86ETOoWqg_FI8xXh9P';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const cameraInput = document.getElementById('cameraInput');
        const loading = document.getElementById('loading');
        const cardForm = document.getElementById('cardForm');

        // Handle Image Scan
        cameraInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loading.classList.remove('hidden');
            cardForm.classList.add('hidden');

            try {
                // OCR Processing
                const result = await Tesseract.recognize(file, 'eng');
                const text = result.data.text;
                
                // Simple Data Extraction using Regex
                const emailMatch = text.match(/[a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+/);
                const phoneMatch = text.match(/(?:\+?\d{1,3}[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/);
                
                // Populate Form
                document.getElementById('email').value = emailMatch ? emailMatch[0] : '';
                document.getElementById('phone').value = phoneMatch ? phoneMatch[0] : '';
                document.getElementById('raw_text').value = text;
                
                // Name and Company often require manual adjustment or more complex NLP
                // Leaving them blank for user to quickly fill or copy-paste from raw text if needed
                document.getElementById('name').value = '';
                document.getElementById('company').value = '';

                loading.classList.add('hidden');
                cardForm.classList.remove('hidden');
            } catch (error) {
                console.error("OCR Error: ", error);
                alert("Failed to scan card.");
                loading.classList.add('hidden');
            }
        });

        // Save Data to Supabase
        async function saveToSupabase() {
            const data = {
                name: document.getElementById('name').value,
                company: document.getElementById('company').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                raw_text: document.getElementById('raw_text').value
            };

            const { error } = await supabaseClient
                .from('business_cards')
                .insert([data]);

            if (error) {
                alert('Error saving data: ' + error.message);
            } else {
                alert('Saved Successfully!');
                cardForm.reset();
                cardForm.classList.add('hidden');
                cameraInput.value = '';
            }
        }

        // Export Data to Excel
        async function exportToExcel() {
            const { data, error } = await supabaseClient
                .from('business_cards')
                .select('name, company, phone, email, created_at');

            if (error) {
                alert('Error fetching data: ' + error.message);
                return;
            }

            if (data.length === 0) {
                alert('No records found to export.');
                return;
            }

            // Create Excel Worksheet
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Business Cards");

            // Download file
            XLSX.writeFile(workbook, "Business_Cards_Export.xlsx");
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
